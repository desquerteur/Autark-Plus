// Owns: packaging the thin phone client: the debug build (Android debug key, package ...preview, as before) and the
// release build signed with the release key, which lives outside the repo (apps/android/new-release-key.ps1 makes it;
// build.ps1 -Release passes it in through AUTARK_ANDROID_KEYSTORE, AUTARK_ANDROID_KEYSTORE_PASSWORD, AUTARK_ANDROID_KEY_ALIAS).
// Play: bundleRelease (full, with the in-app disclosure for phone use) and bundlePlayLite (no AccessibilityService).
// Two stores (flavors): site – the APK from the website, which downloads and installs its own update (SelfUpdate,
// REQUEST_INSTALL_PACKAGES); play – the bundle for Google Play, which has neither and sends the person to Play.
// Feedback 16.11.2026 (F15): build.ps1 writes the feedback video page (assets/tour.html – the PC tour's example video,
// no copy of the PC's UI) into build/generated/tour, which the main assets include.
// Never: bundles desktop credentials or web UI copies, or holds a key or password itself.
plugins { id 'com.android.application' }
def releaseKeystore = System.getenv('AUTARK_ANDROID_KEYSTORE')
android {
    namespace = 'com.teydralab.autark.android'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    defaultConfig {
        applicationId = 'com.teydralab.autark.android'
        minSdk = 26
        targetSdk = 36
        // B-084 (08.11. evening): QR scanner, companies, reconnect, notifications - above the public 0.3.6/code 6.
        // B-084 start crash fix: 0.3.7 closed at once on Android 11+ (SystemBars before setContentView); crash report.
        // B-084 phone linked to all PCs of the company (M1): a channel to every PC online, the page on the newest.
        // 10.11.: 0.3.9 phone-use main-thread fix; 0.3.10 updates and the phone-use build download by themselves (owner 10.11.).
        // 16.11.: 0.3.15 feedback round – quiet notice with the Autark mark, phone-use bubble (ask, status, auto-continue),
        // camera capture, window picture and crash report for feedback, company switch off the main thread.
        versionCode = 15
        versionName = '0.3.15'
    }
    sourceSets { main { assets.srcDir('build/generated/tour') } } // the feedback video page (build.ps1)
    flavorDimensions = ['store']
    productFlavors {
        site { dimension = 'store' }
        play { dimension = 'store' }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv('AUTARK_ANDROID_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('AUTARK_ANDROID_KEY_ALIAS') ?: 'autark'
                keyPassword = System.getenv('AUTARK_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        // The preview phones keep updating the debug build in place (same package, same debug key).
        debug { debuggable = true; applicationIdSuffix = '.preview' }
        release { if (releaseKeystore) signingConfig = signingConfigs.release }
        // The Play build without phone use: release plus src/playLite/AndroidManifest.xml, which removes the AccessibilityService.
        // Play bars apps that are not accessibility tools from letting an AI plan and execute actions through that API;
        // this build is the safe first upload (bundlePlayLite). Same package, same release key.
        playLite {
            initWith release
            matchingFallbacks = ['release']
            if (releaseKeystore) signingConfig = signingConfigs.release
        }
    }
    packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF'] } }
}
dependencies {
    // Ed25519 and X25519 for Android 8+ (the platform has them only from Android 13); the same version Gradle already caches.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'com.google.zxing:core:3.5.3' // QR decoding for the in-app pairing scanner (pair/QrDecode), pure Java
}
