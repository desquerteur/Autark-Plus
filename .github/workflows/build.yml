# Owns: checking every push and pull request from the sources of this repository – the desktop app's typecheck per
# layer, its import boundaries and its unit tests (`npm run check` in apps/desktop) on a clean Linux runner.
# Never: uses a secret, writes to the repository, builds or publishes a release package.
name: Build from source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run check # typecheck, boundaries and the unit tests
